services:
  mysql:
    image: 'mysql:latest'
    environment:
      MYSQL_USER: 'kiwi'
      MYSQL_DATABASE: 'kiwi'
      MYSQL_PASSWORD: 'secret'
      MYSQL_ROOT_PASSWORD: 'verysecret'
    ports:
      - '3847:3306'
    volumes:
      - 'mysql-data:/var/lib/mysql'
  mailcatcher:
    image: 'schickling/mailcatcher:latest'
    ports:
      - '1925:1025'
volumes:
  mysql-data:
    driver: 'local'
